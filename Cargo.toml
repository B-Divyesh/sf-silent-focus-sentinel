[package]
name = "silent-focus-sentinel"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Catch silent and repeated announcements in scripted iOS focus traversals"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-silent-focus-sentinel"
readme = "README.md"
keywords = ["accessibility", "voiceover", "ios", "testing", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]
include = ["/src/**", "/examples/**", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[[bin]]
name = "silent-focus-sentinel"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
