name: Native VoiceOver example

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-example.yml'
      - 'examples/ios/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-traversal:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select and boot an iPhone Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          device_id=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$device_id"
          xcrun simctl boot "$device_id" || true
          open -a Simulator
          xcrun simctl bootstatus "$device_id" -b
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Enable VoiceOver in the booted Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl spawn "${{ steps.simulator.outputs.device_id }}" defaults write com.apple.Accessibility VoiceOverTouchEnabled -bool true
          xcrun simctl spawn "${{ steps.simulator.outputs.device_id }}" notifyutil -p com.apple.accessibility.api
      - name: Build CLI and record the real traversal
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          cargo build --release
          target/release/silent-focus-sentinel record-xctest \
            --scheme SilentFocusSentinelExample \
            --project examples/ios/SilentFocusSentinelExample.xcodeproj \
            --destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            --output artifacts/native-voiceover-trace.json \
            2>&1 | tee artifacts/native-run.log
          test "$(jq '.events | length' artifacts/native-voiceover-trace.json)" -ge 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-voiceover-evidence
          path: artifacts/
