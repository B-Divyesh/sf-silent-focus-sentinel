name: Native iOS example

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-example.yml'
      - 'examples/ios/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcode-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile the app and UI tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project examples/ios/SilentFocusSentinelExample.xcodeproj \
            -scheme SilentFocusSentinelExample \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
